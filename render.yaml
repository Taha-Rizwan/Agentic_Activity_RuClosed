# One-click deploy on Render: New + > Blueprint > select this repo.
services:
  - type: web
    name: ruclosed
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # paste it in the Render dashboard, never in code
      - key: MODEL
        value: claude-haiku-5-5
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /app/data
