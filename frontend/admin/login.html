<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agency Login — RUClosed</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <main class="wrap">
    <form class="card pad login-box grid" id="form">
      <a class="logo" href="/"><span class="mark">RU</span><span><span class="ru">RU</span>Closed</span></a>
      <h2>Agency dashboard</h2>
      <div><label for="email">Email</label><input id="email" type="email" value="admin@capital.demo" required /></div>
      <div><label for="pw">Password</label><input id="pw" type="password" value="demo123" required /></div>
      <div class="err" id="err"></div>
      <button class="btn primary">Log in</button>
      <p class="small muted">Demo tenants: <code>admin@capital.demo</code> or <code>admin@lahore.demo</code>, password <code>demo123</code>.
        Each agency only ever sees its own leads, listings and conversations.</p>
    </form>
  </main>
  <script src="/assets/app.js"></script>
  <script>
    document.getElementById("form").onsubmit = async e => {
      e.preventDefault();
      try {
        const r = await RU.api("/api/admin/login", { body: { email: document.getElementById("email").value, password: document.getElementById("pw").value } });
        RU.store.set("ru_admin", r.token);
        location.href = "/admin/dashboard";
      } catch (err) { document.getElementById("err").textContent = err.message; }
    };
  </script>
</body>
</html>
